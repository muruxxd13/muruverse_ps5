  <style>
    /* --- CSS Variables & Reset --- */
    :root {
      --bg-dark: #050508;
      --bg-panel: rgba(15, 15, 22, 0.85);
      --border-glow: rgba(0, 210, 255, 0.3);
      --neon-blue: #00d2ff;
      --neon-orange: #ff8c00;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --font-header: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      
      /* Auto-loads background.jpg from the same folder with a dark overlay for readability */
      background-image: 
        linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.95)), 
        url('./background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-blend-mode: normal;
    }

    /* --- Animated Background Grid --- */
    .grid-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      pointer-events: none;
      animation: gridMove 20s linear infinite;
      opacity: 0.4;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(30px); }
    }

    /* --- Layout --- */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* --- Header --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 210, 255, 0.05);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Auto-loads logo.png from the same folder */
    .logo-img {
      height: 70px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px var(--neon-blue));
      transition: transform 0.3s ease;
    }
    
    .logo-img:hover {
      transform: scale(1.05);
    }

    .title-area h1 {
      font-family: var(--font-header);
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--neon-orange), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .version-badge {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-family: var(--font-code);
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
      animation: pulse 2s infinite;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
    }

    /* --- Main Content Grid --- */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
      .logo-area {
        flex-direction: column;
      }
    }

    /* --- Panel Styling --- */
    .panel {
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-title {
      font-family: var(--font-header);
      font-size: 1.2rem;
      color: var(--neon-blue);
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      padding-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-code);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
    }

    .status-dot.error {
      background-color: var(--neon-red);
      box-shadow: 0 0 10px var(--neon-red);
    }

    /* --- Form Elements --- */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 8px;
      font-family: var(--font-code);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    select:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    select option {
      background: var(--bg-dark);
      color: var(--text-main);
    }

    /* --- Buttons --- */
    .action-btn {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 210, 255, 0.05));
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      padding: 1.25rem;
      border-radius: 12px;
      font-family: var(--font-header);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .action-btn:hover {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.4), rgba(0, 210, 255, 0.1));
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.5s ease;
      opacity: 0;
    }

    .action-btn:hover::after {
      opacity: 1;
      left: 100%;
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 0.75rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      display: inline-block;
    }

    .secondary-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* --- Console Area --- */
    .console-wrapper {
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      min-height: 400px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
    }

    .console-header {
      background: rgba(0, 210, 255, 0.05);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      font-family: var(--font-code);
      font-size: 0.85rem;
      color: var(--neon-blue);
    }

    #console-output {
      padding: 1rem;
      overflow-y: auto;
      flex: 1;
      font-family: var(--font-code);
      font-size: 0.85rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      scrollbar-width: thin;
      scrollbar-color: var(--neon-blue) transparent;
    }

    #console-output::-webkit-scrollbar {
      width: 8px;
    }
    #console-output::-webkit-scrollbar-track {
      background: transparent;
    }
    #console-output::-webkit-scrollbar-thumb {
      background-color: var(--neon-blue);
      border-radius: 4px;
    }

    .log-line {
      word-break: break-all;
      animation: fadeIn 0.3s ease;
    }

    .log-line.info { color: var(--neon-blue); }
    .log-line.success { color: var(--neon-green); }
    .log-line.warn { color: var(--neon-orange); }
    .log-line.error { color: var(--neon-red); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* --- Footer --- */
    footer {
      margin-top: auto;
      padding: 1.5rem 2rem;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;

    .credits {

    }

    .credits span {
      color: var(--neon-orange);
      font-weight: 600;
    }

    .social-links {

    }

    .social-link {

    }

    .social-link:hover {
      color: var(--neon-blue);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>

  <!-- UI Logic & Console Hijacking -->
  <script>
    (function() {
      const consoleOutput = document.getElementById('console-output');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const exploitBtn = document.getElementById('exploitBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');
      const logCount = document.getElementById('logCount');
      const firmwareSelect = document.getElementById('firmwareSelect');
      const gridBg = document.getElementById('gridBg');

      const maxLogLines = 200;

      function updateLogCount() {
        logCount.textContent = `${consoleOutput.childElementCount} lines`;
      }

      function addLog(message, type = 'info') {
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        const timestamp = new Date().toLocaleTimeString();
        line.textContent = `[${timestamp}] > ${message}`;
        consoleOutput.appendChild(line);
        while (consoleOutput.childElementCount > maxLogLines) {
          consoleOutput.firstElementChild.remove();
        }
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
        updateLogCount();
      }
      window.addUiLog = addLog;

      // Hijack native console methods to display in UI
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;

      console.log = function(...args) {
        originalLog.apply(console, args);
        addLog(args.join(' '), 'info');
      };

      console.error = function(...args) {
        originalError.apply(console, args);
        addLog(args.join(' '), 'error');
      };

      console.warn = function(...args) {
        originalWarn.apply(console, args);
        addLog(args.join(' '), 'warn');
      };

      // --- Auto Detect Firmware Logic ---
      function autoDetectFirmware() {
        addLog('Attempting to auto-detect PS5 firmware...', 'info');
        firmwareSelect.disabled = true;

        const startedAt = Date.now();
        const detect = () => {
          const detectedFw = typeof window.fw_str === 'string' ? window.fw_str : '';
          if (!detectedFw) {
            if (Date.now() - startedAt < 5000) {
              setTimeout(detect, 100);
              return;
            }

            firmwareSelect.disabled = false;
            exploitBtn.disabled = true;
            exploitBtn.textContent = 'PS5 REQUIRED';
            statusDot.className = 'status-dot error';
            statusText.textContent = 'NOT DETECTED';
            statusText.style.color = 'var(--neon-red)';
            addLog('PS5 firmware could not be detected. Manual selection cannot override console firmware.', 'error');
            return;
          }

          const option = Array.from(firmwareSelect.options)
            .find((item) => item.value === detectedFw);
          if (!option) {
            firmwareSelect.disabled = false;
            exploitBtn.disabled = true;
            exploitBtn.textContent = 'UNSUPPORTED FIRMWARE';
            statusDot.className = 'status-dot error';
            statusText.textContent = 'UNSUPPORTED';
            statusText.style.color = 'var(--neon-red)';
            addLog(`Detected firmware ${detectedFw} is not supported.`, 'error');
            return;
          }

          firmwareSelect.value = detectedFw;
          firmwareSelect.disabled = false;
          addLog(`Firmware auto-detected: ${detectedFw}`, 'success');
        };

        detect();
      }

      // Trigger auto detect on load if "auto" is selected
      if (firmwareSelect.value === 'auto') {
        autoDetectFirmware();
      }

      // --- Event Listeners ---

      // Firmware Selection Change
      firmwareSelect.addEventListener('change', (e) => {
        if (e.target.value === 'auto') {
          autoDetectFirmware();
        } else {
          addLog(`Target firmware set to: ${e.target.value}`, 'info');
        }
      });

      // Clear Console
      clearBtn.addEventListener('click', () => {
        consoleOutput.innerHTML = '<div class="log-line info">> Console cleared.</div>';
        updateLogCount();
      });

      // Copy Logs
      copyBtn.addEventListener('click', () => {
        const text = Array.from(consoleOutput.children).map(el => el.textContent).join('\n');
        navigator.clipboard.writeText(text).then(() => {
          addLog('Logs copied to clipboard!', 'success');
        }).catch(() => {
          addLog('Failed to copy logs.', 'error');
        });
      });

      // Run Exploit
      exploitBtn.addEventListener('click', () => {
        const selectedFw = firmwareSelect.value;
        
        if (selectedFw === 'auto') {
          addLog('Please wait for auto-detection to finish or select manually.', 'warn');
          return;
        }

        if (selectedFw !== window.fw_str) {
          addLog('The selected firmware does not match the console firmware; use Auto Detect.', 'error');
          return;
        }

        if (typeof window.startExploit !== 'function') {
          addLog('Exploit runtime is still loading. Try again in a moment.', 'error');
          return;
        }

        exploitBtn.disabled = true;
        exploitBtn.textContent = 'EXPLOITING...';
        exploitBtn.style.opacity = '0.7';
        exploitBtn.style.cursor = 'not-allowed';

        addLog(`Initializing exploit chain for PS5 firmware ${selectedFw}...`, 'info');

        window.startExploit()
          .then(() => {
            addLog(`Exploit sequence for ${selectedFw} completed.`, 'success');
          })
          .catch((error) => {
            addLog(error instanceof Error ? error.message : String(error), 'error');
          });
      });

      window.addEventListener('exploit-state', (event) => {
        const state = event.detail?.state;
        if (state === 'running') {
         statusDot.className = 'status-dot active';
         statusText.textContent = 'RUNNING';
         statusText.style.color = 'var(--neon-green)';
         exploitBtn.disabled = true;
         exploitBtn.textContent = 'EXPLOITING...';
         exploitBtn.style.opacity = '0.7';
         exploitBtn.style.cursor = 'not-allowed';
        } else if (state === 'completed') {
         statusDot.className = 'status-dot';
         statusText.textContent = 'COMPLETED';
         statusText.style.color = 'var(--neon-blue)';
         exploitBtn.textContent = 'COMPLETED';
        } else if (state === 'failed') {
         statusDot.className = 'status-dot error';
         statusText.textContent = 'RELOAD REQUIRED';
         statusText.style.color = 'var(--neon-red)';
         exploitBtn.textContent = 'RELOAD PAGE TO RETRY';
        }
      });

      updateLogCount();
    })();
  </script>
